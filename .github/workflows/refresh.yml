name: Refresh data
on:
  schedule:
    - cron: "0 11 * * *"   # 6-7am US Eastern, after last night's games
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python fetch_snapshot.py
        env:
          NBA_PROXY: ${{ secrets.NBA_PROXY }}
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git commit -m "Data refresh" || exit 0
          git push
